[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "code-agent"
version = "0.1.0"
description = "A local, free, Claude Code-style coding assistant powered by Ollama."
requires-python = ">=3.9"
readme = "README.md"
dependencies = [
    "requests>=2.31",
    "rich>=13.7",
    "pydantic>=2.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
code-agent = "agent.cli:main"

[tool.setuptools]
packages = ["agent", "agent.tools"]
